<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Acteurs de la plateforme"><title>Acteurs de la plateforme</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5B6478"/></marker><marker id="s" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0891B2"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#E6681B"/></marker><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0A1628"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#C0313D"/></marker></defs><rect width="1000" height="560" rx="14" fill="#FFFFFF"/><text x="30" y="36" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#0A1628" text-anchor="start">Les acteurs de la plateforme</text><circle cx="500" cy="270" r="98" fill="#0A1628"/><text x="500" y="262" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">ILLWATCH</text><text x="500" y="284" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#22D3EE" text-anchor="middle">plateforme CTI</text><text x="500" y="300" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#22D3EE" text-anchor="middle">et SOC</text><rect x="40" y="70" width="200" height="80" rx="10" fill="#E6681B"/><text x="140.0" y="107.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Administrateur</text><text x="140.0" y="125.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">comptes, sources, paramètres,</text><text x="140.0" y="139.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">audit, suppression</text><line x1="240" y1="110" x2="430" y2="198.0" stroke="#C9D6E2" stroke-width="2"/><rect x="40" y="200" width="200" height="80" rx="10" fill="#0891B2"/><text x="140.0" y="237.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Analyste L1</text><text x="140.0" y="255.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">triage, acquittement,</text><text x="140.0" y="269.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">ouverture d'incident</text><line x1="240" y1="240" x2="430" y2="256.5" stroke="#C9D6E2" stroke-width="2"/><rect x="40" y="330" width="200" height="80" rx="10" fill="#3A2D8F"/><text x="140.0" y="367.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Analyste L2</text><text x="140.0" y="385.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">investigation, chasse,</text><text x="140.0" y="399.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">faux positifs</text><line x1="240" y1="370" x2="430" y2="315.0" stroke="#C9D6E2" stroke-width="2"/><rect x="40" y="450" width="200" height="80" rx="10" fill="#0A1628"/><text x="140.0" y="487.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Analyste L3</text><text x="140.0" y="505.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">réponse avancée, règles,</text><text x="140.0" y="519.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">clôture</text><line x1="240" y1="490" x2="430" y2="369.0" stroke="#C9D6E2" stroke-width="2"/><rect x="760" y="70" width="200" height="80" rx="10" fill="#8A93A6"/><text x="860.0" y="107.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Lecteur</text><text x="860.0" y="125.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">consulte tout,</text><text x="860.0" y="139.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">ne modifie rien</text><line x1="760" y1="110" x2="570" y2="198.0" stroke="#C9D6E2" stroke-width="2"/><rect x="760" y="200" width="200" height="80" rx="10" fill="#0891B2"/><text x="860.0" y="237.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Partenaire TAXII</text><text x="860.0" y="255.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">SIEM, OpenCTI, MISP :</text><text x="860.0" y="269.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">lit les IOC partagés</text><line x1="760" y1="240" x2="570" y2="256.5" stroke="#C9D6E2" stroke-width="2"/><rect x="760" y="330" width="200" height="80" rx="10" fill="#16A34A"/><text x="860.0" y="367.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Worker (automate)</text><text x="860.0" y="385.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">collecte, CVE, chasse,</text><text x="860.0" y="399.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">corrélation, entretien</text><line x1="760" y1="370" x2="570" y2="315.0" stroke="#C9D6E2" stroke-width="2"/><rect x="760" y="450" width="200" height="80" rx="10" fill="#5B6478"/><text x="860.0" y="487.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sources externes</text><text x="860.0" y="505.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">NVD, KEV, EPSS, OTX,</text><text x="860.0" y="519.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">abuse.ch, TAXII</text><line x1="760" y1="490" x2="570" y2="369.0" stroke="#C9D6E2" stroke-width="2"/><text x="500" y="498" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6478" text-anchor="middle">Visiteur du site : demande de démonstration</text><text x="500" y="516" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5B6478" text-anchor="middle">(formulaire public, suivi par l'administrateur)</text></svg>