<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Architecture d'ILLWATCH"><title>Architecture d'ILLWATCH</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5B6478"/></marker><marker id="s" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0891B2"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#E6681B"/></marker><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0A1628"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#C0313D"/></marker></defs><rect width="1000" height="470" rx="14" fill="#FFFFFF"/><text x="30" y="36" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#0A1628" text-anchor="start">Architecture d'ILLWATCH : un monolithe modulaire en couches</text><rect x="30" y="60" width="640" height="60" rx="10" fill="#E3EEF6"/><text x="50" y="86" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#0A1628" text-anchor="start">Clients</text><text x="50" y="106" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0A1628" text-anchor="start">Navigateur (interface React) · CLI illwatch · API REST · clients TAXII 2.1</text><line x1="350" y1="120" x2="350" y2="132" stroke="#5B6478" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="134" width="640" height="60" rx="10" fill="#D6E6F2"/><text x="50" y="160" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#0A1628" text-anchor="start">Contrôleurs</text><text x="50" y="180" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0A1628" text-anchor="start">illwatch/app/api (FastAPI) · illwatch/cli (Click) : valident, appellent, répondent</text><line x1="350" y1="194" x2="350" y2="206" stroke="#5B6478" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="208" width="640" height="60" rx="10" fill="#0891B2"/><text x="50" y="234" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start">Services métier</text><text x="50" y="254" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="start">illwatch/modules : collecte, IOC, CVE et score, corrélation, incidents, chasse, SOC, ATT&amp;CK, STIX</text><line x1="350" y1="268" x2="350" y2="280" stroke="#5B6478" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="282" width="640" height="60" rx="10" fill="#3A2D8F"/><text x="50" y="308" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start">Accès aux données</text><text x="50" y="328" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="start">SQLAlchemy 2.0 asynchrone · modèles · migrations Alembic</text><line x1="350" y1="342" x2="350" y2="354" stroke="#5B6478" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="356" width="640" height="60" rx="10" fill="#0A1628"/><text x="50" y="382" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start">Persistance</text><text x="50" y="402" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="start">PostgreSQL 16 (contraintes, déclencheurs d'immuabilité) · Redis 7 (verrous, temps réel)</text><text x="350" y="446" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6478" text-anchor="middle" font-style="italic">Dépendance strictement descendante : une couche ne connaît que celle du dessous.</text><text x="720" y="76" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="#0A1628" text-anchor="start">En fonctionnement</text><rect x="720" y="90" width="250" height="56" rx="10" fill="#E6681B"/><text x="845.0" y="115.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Caddy (production)</text><text x="845.0" y="133.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">HTTPS, seul service exposé</text><rect x="720" y="160" width="250" height="56" rx="10" fill="#0891B2"/><text x="845.0" y="185.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">API (uvicorn)</text><text x="845.0" y="203.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">REST, interface, /metrics, /taxii2/</text><rect x="720" y="230" width="250" height="56" rx="10" fill="#0891B2"/><text x="845.0" y="255.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Worker</text><text x="845.0" y="273.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">collecte, CVE, chasse, corrélation</text><rect x="720" y="300" width="250" height="56" rx="10" fill="#0A1628"/><text x="845.0" y="325.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">PostgreSQL 16</text><text x="845.0" y="343.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">données et audit</text><rect x="720" y="370" width="250" height="56" rx="10" fill="#0A1628"/><text x="845.0" y="395.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Redis 7</text><text x="845.0" y="413.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">verrous, limiteur, bus SSE</text><line x1="845" y1="146" x2="845" y2="158" stroke="#5B6478" stroke-width="2" marker-end="url(#a)"/><path d="M970 188 C1000 188 1000 328 972 328" fill="none" stroke="#5B6478" stroke-width="2" marker-end="url(#a)"/><path d="M970 258 C990 258 990 318 972 324" fill="none" stroke="#5B6478" stroke-width="2" marker-end="url(#a)"/><path d="M720 258 C700 258 700 390 718 395" fill="none" stroke="#5B6478" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/></svg>