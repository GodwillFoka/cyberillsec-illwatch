<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Import d'inventaire Excel"><title>Import d'inventaire Excel</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5B6478"/></marker><marker id="s" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0891B2"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#E6681B"/></marker><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0A1628"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#C0313D"/></marker></defs><rect width="1000" height="300" rx="14" fill="#FFFFFF"/><text x="30" y="36" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#0A1628" text-anchor="start">Déclarer son inventaire avec Excel, en quatre étapes</text><rect x="30" y="66" width="220" height="90" rx="10" fill="#E3EEF6"/><text x="140.0" y="108.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#0A1628" text-anchor="middle">1. Modèle</text><text x="140.0" y="126.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#0A1628" text-anchor="middle">« Modèle Excel » ou</text><text x="140.0" y="140.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#0A1628" text-anchor="middle">illwatch assets template</text><line x1="250" y1="111" x2="273" y2="111" stroke="#5B6478" stroke-width="2.2" marker-end="url(#a)"/><rect x="275" y="66" width="220" height="90" rx="10" fill="#D6E6F2"/><text x="385.0" y="108.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#0A1628" text-anchor="middle">2. Remplir</text><text x="385.0" y="126.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#0A1628" text-anchor="middle">une ligne par actif ;</text><text x="385.0" y="140.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#0A1628" text-anchor="middle">nom et produit obligatoires</text><line x1="495" y1="111" x2="518" y2="111" stroke="#5B6478" stroke-width="2.2" marker-end="url(#a)"/><rect x="520" y="66" width="220" height="90" rx="10" fill="#0891B2"/><text x="630.0" y="108.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3. Analyser</text><text x="630.0" y="126.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">aperçu ligne par ligne :</text><text x="630.0" y="140.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">création, mise à jour, refus</text><line x1="740" y1="111" x2="763" y2="111" stroke="#5B6478" stroke-width="2.2" marker-end="url(#a)"/><rect x="765" y="66" width="220" height="90" rx="10" fill="#E6681B"/><text x="875.0" y="108.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4. Importer</text><text x="875.0" y="126.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">tout ou rien ;</text><text x="875.0" y="140.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">journal d'audit</text><path d="M640 156 C640 210 360 210 360 160" fill="none" stroke="#C0313D" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#r)"/><text x="500" y="222" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#C0313D" text-anchor="middle">ligne refusée : rien n'est écrit, corriger le fichier et analyser de nouveau</text><text x="30" y="262" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6478" text-anchor="start">Formats : .xlsx ou .csv (« ; », « , » ou tabulation ; UTF-8 ou Windows-1252). Un actif existant (même nom) est mis à jour ;</text><text x="30" y="280" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6478" text-anchor="start">une colonne absente du fichier ne change pas sa valeur. Export de l'inventaire au même format, réimportable.</text></svg>