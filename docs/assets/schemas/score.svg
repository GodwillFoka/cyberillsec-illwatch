<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="Score de risque composite"><title>Score de risque composite</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5B6478"/></marker><marker id="s" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0891B2"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#E6681B"/></marker><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0A1628"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#C0313D"/></marker></defs><rect width="1000" height="350" rx="14" fill="#FFFFFF"/><text x="30" y="36" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#0A1628" text-anchor="start">Le score de risque d'une CVE : 100 points, 70 pour l'exploitation</text><rect x="30" y="54" width="940" height="44" rx="8" fill="#EEF6FA"/><text x="500" y="82" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#0A1628" text-anchor="middle">R = min(100, CVSS × 3 + EPSS × 25 + KEV × 25 + Exploit × 10 + Ransomware × 10)</text><rect x="30" y="118" width="278.0" height="64" rx="8" fill="#3A2D8F"/><text x="169.0" y="144" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">CVSS × 3</text><text x="169.0" y="162" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">gravité technique · max 30</text><rect x="312.0" y="118" width="231.0" height="64" rx="8" fill="#E6681B"/><text x="427.5" y="144" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">EPSS × 25</text><text x="427.5" y="162" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">probabilité 30 j · max 25</text><rect x="547.0" y="118" width="231.0" height="64" rx="8" fill="#C0313D"/><text x="662.5" y="144" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">KEV</text><text x="662.5" y="162" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">déjà exploitée · max 25</text><rect x="782.0" y="118" width="90.0" height="64" rx="8" fill="#7A4FB5"/><text x="827.0" y="144" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">Exploit</text><text x="827.0" y="162" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">max 10</text><rect x="876.0" y="118" width="90.0" height="64" rx="8" fill="#0A1628"/><text x="921.0" y="144" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">Ransomware</text><text x="921.0" y="162" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">max 10</text><text x="171.0" y="202" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#3A2D8F" text-anchor="middle">Gravité : 30 points</text><text x="641.0" y="202" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#C0313D" text-anchor="middle">Exploitation, prévue ou constatée : 70 points</text><line x1="312.0" y1="190" x2="312.0" y2="210" stroke="#C9D6E2" stroke-width="2"/><rect x="30" y="230" width="225" height="70" rx="10" fill="#C0313D"/><text x="48" y="262" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">P0</text><text x="100" y="258" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">≥ 80</text><text x="100" y="280" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">corriger sous 24 h</text><rect x="267" y="230" width="225" height="70" rx="10" fill="#E6681B"/><text x="285" y="262" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">P1</text><text x="337" y="258" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">60 à 79</text><text x="337" y="280" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">sous 7 jours</text><rect x="504" y="230" width="225" height="70" rx="10" fill="#F59E0B"/><text x="522" y="262" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">P2</text><text x="574" y="258" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">40 à 59</text><text x="574" y="280" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">sous 30 jours</text><rect x="741" y="230" width="225" height="70" rx="10" fill="#8A93A6"/><text x="759" y="262" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">P3</text><text x="811" y="258" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">&lt; 40</text><text x="811" y="280" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">sous 90 jours</text><text x="30" y="330" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6478" text-anchor="start" font-style="italic">Plancher KEV (ADR-014) : une CVE déjà exploitée n'est jamais sous P1. Alerte quand une CVE franchit 75 points.</text></svg>