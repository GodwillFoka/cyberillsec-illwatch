<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" role="img" aria-label="Cycle de vie d'un IOC"><title>Cycle de vie d'un IOC</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5B6478"/></marker><marker id="s" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0891B2"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#E6681B"/></marker><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0A1628"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#C0313D"/></marker></defs><rect width="1000" height="370" rx="14" fill="#FFFFFF"/><text x="30" y="36" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#0A1628" text-anchor="start">Cycle de vie d'un indicateur de compromission (IOC)</text><rect x="30" y="70" width="170" height="70" rx="10" fill="#E3EEF6"/><text x="115.0" y="102.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#0A1628" text-anchor="middle">Reçu</text><text x="115.0" y="120.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#0A1628" text-anchor="middle">7 à 9 sources</text><line x1="200" y1="105" x2="218" y2="105" stroke="#5B6478" stroke-width="2" marker-end="url(#a)"/><rect x="220" y="70" width="170" height="70" rx="10" fill="#E3EEF6"/><text x="305.0" y="102.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#0A1628" text-anchor="middle">Normalisé</text><text x="305.0" y="120.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#0A1628" text-anchor="middle">EVIL[.]com → evil.com</text><line x1="390" y1="105" x2="408" y2="105" stroke="#5B6478" stroke-width="2" marker-end="url(#a)"/><rect x="410" y="70" width="170" height="70" rx="10" fill="#0891B2"/><text x="495.0" y="102.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Dédoublonné</text><text x="495.0" y="120.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">provenance gardée</text><line x1="580" y1="105" x2="598" y2="105" stroke="#5B6478" stroke-width="2" marker-end="url(#a)"/><rect x="600" y="70" width="170" height="70" rx="10" fill="#16A34A"/><text x="685.0" y="102.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Actif</text><text x="685.0" y="120.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">chassé, corrélé, partagé</text><line x1="770" y1="105" x2="788" y2="105" stroke="#5B6478" stroke-width="2" marker-end="url(#a)"/><rect x="790" y="70" width="170" height="70" rx="10" fill="#8A93A6"/><text x="875.0" y="102.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Expiré</text><text x="875.0" y="120.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">gardé pour l'enquête</text><path d="M875 140 C875 210 685 210 685 145" fill="none" stroke="#E6681B" stroke-width="2.2" marker-end="url(#o)"/><text x="712" y="214" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#E6681B" text-anchor="start">revu par une source : réactivé</text><rect x="590" y="240" width="190" height="60" rx="10" fill="#C0313D"/><text x="685.0" y="267.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Exclu</text><text x="685.0" y="285.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">faux positif (L1, L2, L3)</text><path d="M685 140 C700 190 690 210 685 238" fill="none" stroke="#C0313D" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#r)"/><text x="30" y="330" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6478" text-anchor="start">Durée de validité : IP et URL 30 jours · domaines et e-mails 90 jours · empreintes sans limite.</text><text x="30" y="350" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6478" text-anchor="start">La sévérité retenue est la plus haute jamais signalée ; un flux qui répète une valeur ne gonfle pas son compteur.</text></svg>