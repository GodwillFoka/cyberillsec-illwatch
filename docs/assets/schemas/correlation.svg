<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="1100" height="410" role="img" aria-label="Corrélation actifs, CVE et IOC"><title>Corrélation actifs, CVE et IOC</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5B6478"/></marker><marker id="s" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0891B2"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#E6681B"/></marker><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0A1628"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#C0313D"/></marker></defs><rect width="1100" height="410" rx="14" fill="#FFFFFF"/><text x="30" y="36" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#0A1628" text-anchor="start">Corrélation : le renseignement rapporté à VOS actifs</text><rect x="30" y="70" width="220" height="90" rx="10" fill="#E6681B"/><text x="140.0" y="112.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Inventaire</text><text x="140.0" y="130.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">produit, version, plateforme,</text><text x="140.0" y="144.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">adresses, domaines</text><rect x="30" y="190" width="220" height="70" rx="10" fill="#3A2D8F"/><text x="140.0" y="222.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">CVE notées</text><text x="140.0" y="240.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">KEV, exploit, score</text><rect x="30" y="290" width="220" height="70" rx="10" fill="#0891B2"/><text x="140.0" y="322.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">IOC actifs</text><text x="140.0" y="340.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">confiance ≥ 40</text><rect x="330" y="70" width="260" height="80" rx="10" fill="#C0313D"/><text x="460.0" y="107.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">CORR-01</text><text x="460.0" y="125.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">CVE du catalogue KEV</text><text x="460.0" y="139.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">touchant un de vos produits</text><rect x="330" y="170" width="260" height="80" rx="10" fill="#E6681B"/><text x="460.0" y="207.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">CORR-02</text><text x="460.0" y="225.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">CVE P0/P1 avec exploit public</text><text x="460.0" y="239.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">(hors KEV) touchant un produit</text><rect x="330" y="270" width="260" height="80" rx="10" fill="#0891B2"/><text x="460.0" y="307.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">CORR-03</text><text x="460.0" y="325.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">une de vos adresses ou</text><text x="460.0" y="339.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">un de vos domaines dans un IOC</text><path d="M250 115 C290 115 290 110 328 110" fill="none" stroke="#5B6478" stroke-width="1.5" marker-end="url(#a)"/><path d="M250 115 C290 115 290 210 328 210" fill="none" stroke="#5B6478" stroke-width="1.5" marker-end="url(#a)"/><path d="M250 115 C290 115 290 310 328 310" fill="none" stroke="#5B6478" stroke-width="1.5" marker-end="url(#a)"/><path d="M250 225 C290 225 290 110 328 110" fill="none" stroke="#5B6478" stroke-width="1.5" marker-end="url(#a)"/><path d="M250 225 C290 225 290 210 328 210" fill="none" stroke="#5B6478" stroke-width="1.5" marker-end="url(#a)"/><path d="M250 325 C290 325 290 310 328 310" fill="none" stroke="#5B6478" stroke-width="1.5" marker-end="url(#a)"/><rect x="670" y="150" width="150" height="120" rx="10" fill="#E3EEF6"/><text x="745.0" y="207.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#0A1628" text-anchor="middle">Version</text><text x="745.0" y="225.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#0A1628" text-anchor="middle">comparée aux plages</text><text x="745.0" y="239.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#0A1628" text-anchor="middle">vulnérables NVD</text><text x="745.0" y="253.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#0A1628" text-anchor="middle">(ADR-021)</text><path d="M590 110 C630 110 630 210 668 210" fill="none" stroke="#5B6478" stroke-width="1.5" marker-end="url(#a)"/><path d="M590 210 C630 210 630 210 668 210" fill="none" stroke="#5B6478" stroke-width="1.5" marker-end="url(#a)"/><path d="M590 310 C630 310 630 210 668 210" fill="none" stroke="#5B6478" stroke-width="1.5" marker-end="url(#a)"/><rect x="870" y="70" width="200" height="90" rx="10" fill="#0A1628"/><text x="970.0" y="112.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Évènement</text><text x="970.0" y="130.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">score 0-100 justifié,</text><text x="970.0" y="144.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">priorité P0 à P3</text><rect x="870" y="190" width="200" height="70" rx="10" fill="#8A93A6"/><text x="970.0" y="222.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Hors plage</text><text x="970.0" y="240.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">clos automatiquement</text><rect x="870" y="290" width="200" height="70" rx="10" fill="#C0313D"/><text x="970.0" y="322.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Incident</text><text x="970.0" y="340.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">ouvert en un clic</text><path d="M820 190 C850 190 840 115 868 115" fill="none" stroke="#0A1628" stroke-width="2" marker-end="url(#n)"/><path d="M820 230 C845 230 845 225 868 225" fill="none" stroke="#5B6478" stroke-width="1.6" marker-end="url(#a)"/><path d="M1070 115 C1095 115 1095 325 1072 325" fill="none" stroke="#C0313D" stroke-width="2" marker-end="url(#r)"/><text x="30" y="395" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6478" text-anchor="start" font-style="italic">Score = base de la règle + criticité de l'actif + risque de la CVE ou confiance de l'IOC. Passe automatique chaque heure.</text></svg>