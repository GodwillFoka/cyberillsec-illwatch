<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 375" width="1000" height="375" role="img" aria-label="Cycle d'un incident et niveaux SOC"><title>Cycle d'un incident et niveaux SOC</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5B6478"/></marker><marker id="s" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0891B2"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#E6681B"/></marker><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0A1628"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#C0313D"/></marker></defs><rect width="1000" height="375" rx="14" fill="#FFFFFF"/><text x="30" y="36" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#0A1628" text-anchor="start">Un incident, du signalement à la clôture (NIST SP 800-61)</text><rect x="30" y="70" width="140" height="56" rx="10" fill="#E3EEF6"/><text x="100.0" y="103.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#0A1628" text-anchor="middle">Nouveau</text><line x1="170" y1="98" x2="188" y2="98" stroke="#5B6478" stroke-width="2" marker-end="url(#a)"/><rect x="190" y="70" width="140" height="56" rx="10" fill="#3A2D8F"/><text x="260.0" y="103.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Analyse</text><line x1="330" y1="98" x2="348" y2="98" stroke="#5B6478" stroke-width="2" marker-end="url(#a)"/><rect x="350" y="70" width="140" height="56" rx="10" fill="#E6681B"/><text x="420.0" y="103.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Confinement</text><line x1="490" y1="98" x2="508" y2="98" stroke="#5B6478" stroke-width="2" marker-end="url(#a)"/><rect x="510" y="70" width="140" height="56" rx="10" fill="#C0313D"/><text x="580.0" y="103.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Éradication</text><line x1="650" y1="98" x2="668" y2="98" stroke="#5B6478" stroke-width="2" marker-end="url(#a)"/><rect x="670" y="70" width="140" height="56" rx="10" fill="#0891B2"/><text x="740.0" y="103.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Récupération</text><line x1="810" y1="98" x2="828" y2="98" stroke="#5B6478" stroke-width="2" marker-end="url(#a)"/><rect x="830" y="70" width="140" height="56" rx="10" fill="#16A34A"/><text x="900.0" y="103.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Clôture</text><path d="M420 126 C420 160 260 160 260 128" fill="none" stroke="#3A2D8F" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a)"/><path d="M580 126 C580 160 260 160 260 128" fill="none" stroke="#3A2D8F" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a)"/><path d="M740 126 C740 160 260 160 260 128" fill="none" stroke="#3A2D8F" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="560" y="184" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3A2D8F" text-anchor="middle">retour en analyse possible depuis confinement, éradication, récupération</text><text x="30" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6478" text-anchor="start" font-style="italic">Chaque étape est écrite dans une chronologie immuable (la base refuse modification et suppression). Clôture : résumé obligatoire.</text><rect x="30" y="230" width="300" height="96" rx="10" fill="#0891B2"/><text x="48" y="266" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">L1</text><text x="100" y="262" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">qualifie</text><text x="100" y="284" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="start">acquitte, ouvre l'incident,</text><text x="100" y="300" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="start">écarte les faux positifs</text><line x1="330" y1="278" x2="358" y2="278" stroke="#E6681B" stroke-width="2.5" marker-end="url(#o)"/><rect x="360" y="230" width="300" height="96" rx="10" fill="#3A2D8F"/><text x="378" y="266" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">L2</text><text x="430" y="262" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">investigue</text><text x="430" y="284" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="start">chasse depuis l'incident,</text><text x="430" y="300" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="start">enrichit, associe IOC et CVE</text><line x1="660" y1="278" x2="688" y2="278" stroke="#E6681B" stroke-width="2.5" marker-end="url(#o)"/><rect x="690" y="230" width="300" height="96" rx="10" fill="#0A1628"/><text x="708" y="266" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">L3</text><text x="760" y="262" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">traite</text><text x="760" y="284" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="start">réponse avancée,</text><text x="760" y="300" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="start">règles, clôture</text><text x="30" y="356" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6478" text-anchor="start" font-style="italic">Escalade motivée, sans retour en arrière. Délais cibles : critique 1 h / 24 h · élevée 4 h / 72 h · moyenne 24 h / 7 j · faible 72 h / 30 j.</text></svg>