<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Score de confiance d'un IOC"><title>Score de confiance d'un IOC</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5B6478"/></marker><marker id="s" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0891B2"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#E6681B"/></marker><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0A1628"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#C0313D"/></marker></defs><rect width="1000" height="230" rx="14" fill="#FFFFFF"/><text x="30" y="36" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#0A1628" text-anchor="start">La confiance d'un IOC (0-100) : peut-on agir dessus ?</text><rect x="30" y="60" width="456" height="90" rx="10" fill="#0891B2"/><text x="44" y="88" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="start">Sources · 60 points</text><text x="44" y="112" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="start">corroboration pondérée par la fiabilité</text><text x="44" y="128" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="start">(A = 0,90 … F = 0,10)</text><rect x="490" y="60" width="286" height="90" rx="10" fill="#3A2D8F"/><text x="504" y="88" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="start">Fraîcheur · 30 points</text><text x="504" y="112" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="start">demi-vie selon le type :</text><text x="504" y="128" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="start">IP 7 j · URL 14 j · domaine 30 j · empreinte 180 j</text><rect x="780" y="60" width="186" height="90" rx="10" fill="#0A1628"/><text x="794" y="88" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="start">Récurrence · 10 points</text><text x="794" y="112" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="start">observations répétées</text><text x="794" y="128" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="start">(échelle logarithmique)</text><rect x="30" y="172" width="185" height="40" rx="8" fill="#16A34A"/><text x="122" y="197" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Élevée : ≥ 70</text><rect x="230" y="172" width="185" height="40" rx="8" fill="#F59E0B"/><text x="322" y="197" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Moyenne : 40 à 69</text><rect x="430" y="172" width="185" height="40" rx="8" fill="#8A93A6"/><text x="522" y="197" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Faible : &lt; 40</text><text x="640" y="197" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6478" text-anchor="start" font-style="italic">La corrélation n'utilise que les IOC de confiance ≥ 40.</text></svg>