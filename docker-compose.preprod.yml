# ============================================================================
# ILL Watch — préproduction LOCALE (ajout au-dessus de docker-compose.prod.yml)
#
#   ./scripts/preprod-local.sh up        # le script fournit les fichiers et les secrets
#
# Même pile que la production (image finale, migrations éphémères, rôle applicatif, Redis
# protégé, Caddy en HTTPS) mais :
# - projet, conteneurs et volumes distincts (`illwatch-preprod`) : la pile de développement
#   (illwatch-postgres sur 5433, uvicorn sur 8000) et ses données ne sont jamais touchées ;
# - Caddy n'écoute que sur 127.0.0.1, ports 8443 (HTTPS) et 8080 (HTTP) : rien n'est exposé
#   au réseau, aucun conflit avec un service déjà présent sur 80/443 ;
# - certificat de l'autorité interne de Caddy pour « illwatch.localhost » (ILLWATCH_DOMAIN) ;
# - même sous-réseau fixe que docker-compose.prod.yml (172.30.0.0/24) : ne pas lancer en même
#   temps qu'une pile de production locale.
# ============================================================================
name: illwatch-preprod

services:
  postgres:
    container_name: illwatch-preprod-postgres
    volumes: !override
      - preprod_pgdata:/var/lib/postgresql/data
      - ./scripts/db/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro

  redis:
    container_name: illwatch-preprod-redis
    volumes: !override
      - preprod_redisdata:/data

  migrate:
    container_name: illwatch-preprod-migrate

  api:
    container_name: illwatch-preprod-api

  worker:
    container_name: illwatch-preprod-worker

  caddy:
    container_name: illwatch-preprod-caddy
    ports: !override
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8080:80"

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  preprod_pgdata:
    name: illwatch_preprod_pgdata
  preprod_redisdata:
    name: illwatch_preprod_redisdata
