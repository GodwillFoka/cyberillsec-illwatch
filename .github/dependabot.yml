# Mises à jour des actions GitHub et des images de base (les dépendances Python sont figées par
# constraints.txt et suivies par Renovate côté GitLab).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: "chore(docker)"
