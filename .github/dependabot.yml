# Mises à jour des actions GitHub, des images de base et de l'interface web (npm) (les dépendances Python sont figées par
# constraints.txt et suivies par Renovate côté GitLab).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: "chore(docker)"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: "chore(web)"
