# Mises à jour des actions GitHub, des images de base et de l'interface web (npm) (les dépendances Python sont figées par
# constraints.txt et suivies par Renovate côté GitLab).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Image de construction de l'interface : versions LTS paires de Node uniquement (22, 24…),
      # changées par décision explicite, pas par mise à jour automatique.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: "chore(web)"
    # Mineures et correctives seulement, regroupées ; une version majeure (React 19, Vite 8…)
    # est une migration planifiée, avec sa branche et ses vérifications.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      interface:
        update-types: [minor, patch]
