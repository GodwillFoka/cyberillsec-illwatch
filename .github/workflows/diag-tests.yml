# Diagnostic temporaire (30/10/2026) : la suite Pytest bloque le runner sur la branche
# feat/inventaire-import-docs-v2. Chaque fichier de tests tourne seul, avec une limite de temps
# et de mémoire ; le résultat de chacun remonte en annotation pendant l'exécution.
# À supprimer avant la fusion.
name: Diagnostic tests

on:
  push:
    branches: ["feat/inventaire-import-docs-v2"]

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: illwatch
          POSTGRES_PASSWORD: illwatch
          POSTGRES_DB: illwatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U illwatch" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://illwatch:illwatch@localhost:5432/illwatch_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev]"
      - name: A. comme ci.yml (.env présent, tee pytest.txt)
        shell: bash
        run: |
          set +e
          cp .env.example .env
          START=$(date +%s)
          timeout -s KILL 300 bash -c "pytest --cov-report=term-missing --cov-report=xml --junitxml=report.xml 2>&1 | tee pytest.txt > /dev/null"
          RC=$?; DUR=$(( $(date +%s) - START ))
          RES=$(grep -E "passed|failed" pytest.txt | tail -1)
          LAST=$(grep -E "^tests/.*::" pytest.txt | tail -1)
          echo "::error title=A env+tee rc=$RC ${DUR}s::${RES:0:200} // dernier : ${LAST:0:400}"
          rm -f pytest.txt
      - name: B. .env présent, sortie hors du dépôt
        shell: bash
        run: |
          set +e
          START=$(date +%s)
          timeout -s KILL 300 bash -c "pytest -p no:cacheprovider --no-cov > /tmp/b.txt 2>&1"
          RC=$?; DUR=$(( $(date +%s) - START ))
          RES=$(grep -E "passed|failed" /tmp/b.txt | tail -1)
          LAST=$(grep -E "^tests/.*::" /tmp/b.txt | tail -1)
          echo "::error title=B env rc=$RC ${DUR}s::${RES:0:200} // dernier : ${LAST:0:400}"
      - name: C. sans .env, tee pytest.txt dans le dépôt
        shell: bash
        run: |
          set +e
          rm -f .env
          START=$(date +%s)
          timeout -s KILL 300 bash -c "pytest -p no:cacheprovider --no-cov 2>&1 | tee pytest.txt > /dev/null"
          RC=$?; DUR=$(( $(date +%s) - START ))
          RES=$(grep -E "passed|failed" pytest.txt | tail -1)
          LAST=$(grep -E "^tests/.*::" pytest.txt | tail -1)
          echo "::error title=C tee rc=$RC ${DUR}s::${RES:0:200} // dernier : ${LAST:0:400}"
