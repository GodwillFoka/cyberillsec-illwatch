# Diagnostic temporaire (30/10/2026) : la suite Pytest bloque le runner sur la branche
# feat/inventaire-import-docs-v2. Chaque fichier de tests tourne seul, avec une limite de temps
# et de mémoire ; le résultat de chacun remonte en annotation pendant l'exécution.
# À supprimer avant la fusion.
name: Diagnostic tests

on:
  push:
    branches: ["feat/inventaire-import-docs-v2"]

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: illwatch
          POSTGRES_PASSWORD: illwatch
          POSTGRES_DB: illwatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U illwatch" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://illwatch:illwatch@localhost:5432/illwatch_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev]"
      - name: Fichier par fichier
        shell: bash
        run: |
          for f in tests/test_*.py; do
            START=$(date +%s)
            timeout -s KILL 150 bash -c "ulimit -v 6000000; pytest -q -p no:cacheprovider --no-cov $f" > out.txt 2>&1
            RC=$?
            DUR=$(( $(date +%s) - START ))
            SUMMARY=$(grep -E "passed|failed|error" out.txt | tail -1)
            echo "::notice title=$f::rc=$RC en ${DUR}s · ${SUMMARY:0:300}"
            if [ "$RC" -ne 0 ]; then
              LAST=$(grep -E "::" out.txt | grep -vE "^(PASSED|FAILED)" | tail -1)
              echo "::error title=$f rc=$RC::dernier : ${LAST:0:300}"
              grep -E "MemoryError|Error|error|Timeout|FAILED" out.txt | tail -8 | while read -r line; do
                echo "::warning title=$f::${line:0:500}"
              done || true
            fi
          done
