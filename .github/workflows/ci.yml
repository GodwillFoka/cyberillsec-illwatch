# ============================================================================
# SENTRY — Pipeline d'intégration continue GitHub Actions
# Miroir de .gitlab-ci.yml (GitLab reste le dépôt de référence, ADR-002) :
# qualité, tests PostgreSQL/Redis réels, migrations, image Docker, sécurité.
# ============================================================================
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: ci-secret-key-not-for-production
  ENVIRONMENT: development

jobs:
  # ---------------------------------------------------------------------------
  # Étape 1 — Qualité : lint, formatage, typage strict
  # ---------------------------------------------------------------------------
  qualite:
    name: Qualité (ruff, mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          # constraints.txt (M7) fige les versions quand il existe.
          if [ -f constraints.txt ]; then pip install -c constraints.txt -e ".[dev]"; else pip install -e ".[dev]"; fi
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy sentry

  # ---------------------------------------------------------------------------
  # Étape 2 — Tests : suite complète contre PostgreSQL 16 et Redis 7 réels
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.12 : version minimale supportée ; 3.14 : version des postes de développement.
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentry
          POSTGRES_PASSWORD: sentry
          POSTGRES_DB: sentry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentry" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://sentry:sentry@localhost:5432/sentry_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f constraints.txt ]; then pip install -c constraints.txt -e ".[dev]"; else pip install -e ".[dev]"; fi
      # Clone neuf (06/10) : le démarrage rapide du README copie .env.example en .env.
      # La configuration doit s'en charger telle quelle, et les tests doivent l'ignorer
      # (sa MIGRATION_DATABASE_URL vise une base de travail, jamais celle des tests).
      - name: Clone neuf (.env.example en place)
        shell: bash
        run: |
          cp .env.example .env
          env -u DATABASE_URL -u REDIS_URL python -c "from sentry.app.config import Settings; \
            s = Settings(); print('.env.example chargé :', s.environment, s.expose_docs)"
      - name: Pytest
        shell: bash
        run: |
          set -o pipefail
          pytest --cov-report=term-missing --cov-report=xml --junitxml=report.xml | tee pytest.txt
      - name: Résultat lisible (annotation)
        if: always()
        shell: bash
        run: |
          RES=$(grep -E "^=+ .*(passed|failed|error).* =+$" pytest.txt | tail -1 | tr -d '=' | xargs)
          COV=$(grep -E "^TOTAL" pytest.txt | awk '{print $NF}')
          echo "::notice title=Tests Python ${{ matrix.python }}::${RES} · couverture ${COV}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapports-tests-py${{ matrix.python }}
          path: |
            report.xml
            coverage.xml
          retention-days: 7

  # Cohérence ORM ↔ migrations ↔ PostgreSQL sur une base vierge :
  # montée complète, comparaison modèle/schéma, descente, remontée.
  migrations:
    name: Migrations Alembic
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentry
          POSTGRES_PASSWORD: sentry
          POSTGRES_DB: sentry_migrations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentry" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://sentry:sentry@localhost:5432/sentry_migrations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f constraints.txt ]; then pip install -c constraints.txt -e ".[dev]"; else pip install -e ".[dev]"; fi
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head

  # ---------------------------------------------------------------------------
  # Étape 3 — Build : l'image doit se construire et la CLI répondre
  # ---------------------------------------------------------------------------
  image:
    name: Image Docker
    runs-on: ubuntu-24.04
    needs: [qualite]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t sentry:${{ github.sha }} .
      - run: docker run --rm --entrypoint sentry sentry:${{ github.sha }} version
      # 07/10 : curl retiré de l'image (8 vulnérabilités « High » sans correctif Debian) ; le
      # HEALTHCHECK passe par Python. On vérifie les deux : curl absent, sonde fonctionnelle.
      - name: Image sans curl, contrôle de santé fonctionnel
        shell: bash
        run: |
          IMG=sentry:${{ github.sha }}
          docker run --rm --entrypoint sh "$IMG" -c '! command -v curl'
          docker run -d --name hc -e SECRET_KEY=ci-secret-key-not-for-production \
            -e DATABASE_URL=sqlite+aiosqlite:///:memory: --entrypoint uvicorn "$IMG" \
            sentry.app.main:app --host 0.0.0.0 --port 8000
          probe=$(docker inspect --format '{{json .Config.Healthcheck.Test}}' "$IMG" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)[-1])')
          for i in $(seq 1 20); do
            docker exec hc python -c "$probe" && { echo "sonde OK"; ok=1; break; }
            sleep 1
          done
          docker logs hc | tail -20; docker rm -f hc
          [ "${ok:-0}" = 1 ]
      - name: Fichiers Compose valides
        env:
          SECRET_KEY: ci-dummy
          POSTGRES_PASSWORD: ci-dummy
          POSTGRES_APP_PASSWORD: ci-dummy
          REDIS_PASSWORD: ci-dummy
        run: |
          touch .env
          docker compose -f docker-compose.yml config -q
          if [ -f docker-compose.prod.yml ]; then
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full config -q
          fi

  # ---------------------------------------------------------------------------
  # Étape 4 — Sécurité : dépendances (pip-audit) et code (bandit)
  # ---------------------------------------------------------------------------
  securite:
    name: Sécurité (pip-audit, bandit, gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks analyse tout l'historique, pas seulement le dernier commit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip pip-audit bandit
          if [ -f constraints.txt ]; then pip install -c constraints.txt -e ".[dev]"; else pip install -e ".[dev]"; fi
      - name: pip-audit (vulnérabilités connues des dépendances installées)
        run: pip-audit --skip-editable
      - name: bandit (sévérité moyenne et plus)
        run: bandit -q -r sentry -ll
      # Détection de secrets sur tout l'historique (07/10). Exclusions justifiées dans
      # .gitleaks.toml ; version épinglée et somme de contrôle vérifiée.
      - name: gitleaks (secrets dans l'historique Git)
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"  # nom d'origine : sha256sum -c le cherche sous ce nom
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum -c -
          tar xzf "$archive" gitleaks
          ./gitleaks git . --log-opts="--all" --config .gitleaks.toml --redact --no-banner
