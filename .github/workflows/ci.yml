# ============================================================================
# ILLWATCH — Pipeline d'intégration continue GitHub Actions
# Miroir de .gitlab-ci.yml (GitLab reste le dépôt de référence, ADR-002) :
# qualité, tests PostgreSQL/Redis réels, migrations, image Docker, sécurité.
# ============================================================================
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: ci-secret-key-not-for-production
  ENVIRONMENT: development

jobs:
  # ---------------------------------------------------------------------------
  # Étape 1 — Qualité : lint, formatage, typage strict
  # ---------------------------------------------------------------------------
  qualite:
    name: Qualité (ruff, mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          # constraints.txt (M7) fige les versions quand il existe.
          if [ -f constraints.txt ]; then pip install -c constraints.txt -e ".[dev]"; else pip install -e ".[dev]"; fi
      - run: ruff check --output-format=github .
      - name: Formatage (ruff format)
        run: |
          ruff format --check . > format.txt 2>&1 || {
            grep -E "^Would reformat" format.txt | head -20 | while read -r l; do echo "::error title=ruff format::$l"; done
            exit 1; }
      - name: Typage (mypy)
        run: |
          mypy illwatch > mypy.txt 2>&1 || {
            cat mypy.txt
            grep -E "error:" mypy.txt | head -20 | while read -r l; do echo "::error title=mypy::${l:0:900}"; done
            exit 1; }

  # ---------------------------------------------------------------------------
  # Étape 2 — Tests : suite complète contre PostgreSQL 16 et Redis 7 réels
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.12 : version minimale supportée ; 3.14 : version des postes de développement.
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: illwatch
          POSTGRES_PASSWORD: illwatch
          POSTGRES_DB: illwatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U illwatch" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://illwatch:illwatch@localhost:5432/illwatch_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f constraints.txt ]; then pip install -c constraints.txt -e ".[dev]"; else pip install -e ".[dev]"; fi
      # Clone neuf (06/10) : le démarrage rapide du README copie .env.example en .env.
      # La configuration doit s'en charger telle quelle, et les tests doivent l'ignorer
      # (sa MIGRATION_DATABASE_URL vise une base de travail, jamais celle des tests).
      - name: Clone neuf (.env.example en place)
        shell: bash
        run: |
          cp .env.example .env
          env -u DATABASE_URL -u REDIS_URL python -c "from illwatch.app.config import Settings; \
            s = Settings(); print('.env.example chargé :', s.environment, s.expose_docs)"
      - name: Pytest
        shell: bash
        run: |
          set -o pipefail
          pytest --cov-report=term-missing --cov-report=xml --junitxml=report.xml | tee pytest.txt
      - name: Résultat lisible (annotation)
        if: always()
        shell: bash
        run: |
          RES=$(grep -E "^=+ .*(passed|failed|error).* =+$" pytest.txt | tail -1 | tr -d '=' | xargs)
          COV=$(grep -E "^TOTAL" pytest.txt | awk '{print $NF}')
          echo "::notice title=Tests Python ${{ matrix.python }}::${RES} · couverture ${COV}"
          # Un test en échec devient une annotation lisible sans télécharger les journaux.
          grep -E "^(FAILED|ERROR) " pytest.txt | head -20 | while read -r line; do
            echo "::error title=Test en échec (Python ${{ matrix.python }})::${line:0:900}"
          done || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapports-tests-py${{ matrix.python }}
          path: |
            report.xml
            coverage.xml
          retention-days: 7

  # Cohérence ORM ↔ migrations ↔ PostgreSQL sur une base vierge :
  # montée complète, comparaison modèle/schéma, descente, remontée.
  migrations:
    name: Migrations Alembic
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: illwatch
          POSTGRES_PASSWORD: illwatch
          POSTGRES_DB: illwatch_migrations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U illwatch" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://illwatch:illwatch@localhost:5432/illwatch_migrations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f constraints.txt ]; then pip install -c constraints.txt -e ".[dev]"; else pip install -e ".[dev]"; fi
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head

  # ---------------------------------------------------------------------------
  # Interface web (ADR-016) : types générés depuis l'API, compilation, tests, build
  # ---------------------------------------------------------------------------
  interface:
    name: Interface web (TypeScript, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Schéma OpenAPI de l'API
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e .
          illwatch openapi -o frontend/openapi.json
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Dépendances
        working-directory: frontend
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Audit des dépendances livrées au navigateur
        working-directory: frontend
        # Les outils de développement (Vite, esbuild) ne sont pas dans l'image ; ce qui part au
        # navigateur ne doit porter aucune vulnérabilité élevée ou critique connue.
        run: |
          npm audit --omit=dev --audit-level=high > audit.txt 2>&1 || {
            cat audit.txt
            npm audit --omit=dev --json 2>/dev/null | node -e '
              const r = JSON.parse(require("fs").readFileSync(0, "utf8"));
              for (const [name, v] of Object.entries(r.vulnerabilities || {})) {
                const via = (v.via || []).map((x) => (typeof x === "string" ? x : x.title + " " + (x.url || ""))).join(" | ");
                console.log("::error title=npm audit " + v.severity + "::" + name + " " + v.range + " — " + via.slice(0, 700));
              }'
            exit 1; }
      - name: Audit des outils de développement (informatif)
        working-directory: frontend
        # Vite, esbuild : absents de l'image, mais à surveiller (poste de développement).
        run: |
          npm audit --json 2>/dev/null | node -e '
            const r = JSON.parse(require("fs").readFileSync(0, "utf8"));
            for (const [name, v] of Object.entries(r.vulnerabilities || {})) {
              const via = (v.via || []).map((x) => (typeof x === "string" ? x : x.title + " " + (x.url || ""))).join(" | ");
              const fix = v.fixAvailable && typeof v.fixAvailable === "object" ? " → " + v.fixAvailable.name + " " + v.fixAvailable.version : "";
              console.log("::warning title=npm audit (dév.) " + v.severity + "::" + name + " " + v.range + fix + " — " + via.slice(0, 600));
            }' || true
      - name: Types TypeScript générés depuis l'API
        working-directory: frontend
        run: npm run gen:api
      - name: Compilation TypeScript
        working-directory: frontend
        run: |
          npx tsc --noEmit --pretty false > tsc.txt 2>&1 || {
            cat tsc.txt
            grep -E "error TS" tsc.txt | head -25 | while read -r l; do echo "::error title=TypeScript::${l:0:900}"; done
            exit 1; }
      - name: Tests
        working-directory: frontend
        run: |
          npm test > tests.txt 2>&1 || {
            cat tests.txt
            grep -E "^not ok|AssertionError|Error" tests.txt | head -20 | while read -r l; do echo "::error title=Tests interface::${l:0:900}"; done
            exit 1; }
      - name: Build de production
        working-directory: frontend
        run: |
          npx vite build > build.txt 2>&1 || {
            cat build.txt
            grep -iE "error" build.txt | head -20 | while read -r l; do echo "::error title=Vite::${l:0:900}"; done
            exit 1; }
          cat build.txt
          test -f dist/index.html
          # Aucun script en ligne : la politique `script-src 'self'` de l'interface le refuserait.
          ! grep -E "<script>[^<]" dist/index.html
      - name: Fichier de verrouillage proposé
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interface-package-lock
          path: frontend/package-lock.json
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Étape 3 — Build : l'image doit se construire et la CLI répondre
  # ---------------------------------------------------------------------------
  image:
    name: Image Docker
    runs-on: ubuntu-24.04
    needs: [qualite]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t illwatch:${{ github.sha }} .
      - run: docker run --rm --entrypoint illwatch illwatch:${{ github.sha }} version
      - name: Interface web présente dans l'image
        run: docker run --rm --entrypoint test illwatch:${{ github.sha }} -f /app/web/index.html
      # 07/10 : curl retiré de l'image (8 vulnérabilités « High » sans correctif Debian) ; le
      # HEALTHCHECK passe par Python. On vérifie les deux : curl absent, sonde fonctionnelle.
      - name: Image sans curl, contrôle de santé fonctionnel
        shell: bash
        run: |
          IMG=illwatch:${{ github.sha }}
          docker run --rm --entrypoint sh "$IMG" -c '! command -v curl'
          docker run -d --name hc -e SECRET_KEY=ci-secret-key-not-for-production \
            -e DATABASE_URL=sqlite+aiosqlite:///:memory: --entrypoint uvicorn "$IMG" \
            illwatch.app.main:app --host 0.0.0.0 --port 8000
          probe=$(docker inspect --format '{{json .Config.Healthcheck.Test}}' "$IMG" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)[-1])')
          for i in $(seq 1 20); do
            docker exec hc python -c "$probe" && { echo "sonde OK"; ok=1; break; }
            sleep 1
          done
          # L'interface est servie à la racine, avec sa politique de sécurité.
          docker exec hc python -c "import urllib.request as u; r=u.urlopen('http://localhost:8000/', timeout=4); body=r.read().decode(); assert 'id=\"root\"' in body, body[:200]; assert \"script-src 'self'\" in r.headers['Content-Security-Policy']; print('interface OK')" || ok=0
          docker logs hc | tail -20; docker rm -f hc
          [ "${ok:-0}" = 1 ]
      - name: Fichiers Compose valides
        env:
          SECRET_KEY: ci-dummy
          POSTGRES_PASSWORD: ci-dummy
          POSTGRES_APP_PASSWORD: ci-dummy
          REDIS_PASSWORD: ci-dummy
        run: |
          touch .env
          docker compose -f docker-compose.yml config -q
          if [ -f docker-compose.prod.yml ]; then
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full config -q
          fi

  # ---------------------------------------------------------------------------
  # Étape 4 — Sécurité : dépendances (pip-audit) et code (bandit)
  # ---------------------------------------------------------------------------
  securite:
    name: Sécurité (pip-audit, bandit, gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks analyse tout l'historique, pas seulement le dernier commit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip pip-audit bandit
          if [ -f constraints.txt ]; then pip install -c constraints.txt -e ".[dev]"; else pip install -e ".[dev]"; fi
      - name: pip-audit (vulnérabilités connues des dépendances installées)
        run: pip-audit --skip-editable
      - name: bandit (sévérité moyenne et plus)
        run: bandit -q -r illwatch -ll
      # Détection de secrets sur tout l'historique (07/10). Exclusions justifiées dans
      # .gitleaks.toml ; version épinglée et somme de contrôle vérifiée.
      - name: gitleaks (secrets dans l'historique Git)
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"  # nom d'origine : sha256sum -c le cherche sous ce nom
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum -c -
          tar xzf "$archive" gitleaks
          ./gitleaks git . --log-opts="--all" --config .gitleaks.toml --redact --no-banner
