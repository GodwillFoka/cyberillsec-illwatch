# ============================================================================
# SENTRY — Site de documentation sur GitHub Pages
# https://godwillfoka.github.io/cyberillsec-sentry/
# Source : docs/, Rapport/, CHANGELOG.md, CONTRIBUTING.md, SECURITY.md (scripts/docs_prepare.py)
# ============================================================================
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "Rapport/**"
      - "*.md"
      - "mkdocs.yml"
      - "scripts/docs_prepare.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: ["docs/**", "Rapport/**", "*.md", "mkdocs.yml", "scripts/docs_prepare.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construction du site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material>=9.5,<10"
      - run: python scripts/docs_prepare.py
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Publication GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
