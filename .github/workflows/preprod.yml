# ============================================================================
# ILL Watch — Préproduction locale, exécutée en CI
#
# Monte la pile de PRODUCTION (image finale, migrations éphémères, rôle applicatif, Redis
# protégé, Caddy HTTPS) avec scripts/preprod-local.sh, exactement comme sur un poste :
#   up → demo (données fictives) → check (HTTPS, en-têtes, API, SSE via Caddy, droits,
#   worker, sauvegarde/restauration) → captures d'écran de chaque écran.
# Les captures sont publiées sur la branche « captures » (lisible par `git fetch`) pour la
# revue visuelle ; un écran en erreur ou une violation CSP fait échouer le job.
# ============================================================================
name: Préproduction

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preprod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preprod:
    name: Pile de production locale (HTTPS, contrôles, captures)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Démonstration : worker non démarré, base restée vide pour les données fictives.
    env:
      PREPROD_MODE: demo
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Instance en anglais (ADR-027, décision 12) : le jeu de démonstration et les textes écrits
      # par le serveur (titres, chronologie, recommandations) sont en anglais, comme
      # l'interface des captures principales — langue commune du site et des présentations.
      - name: Langue de l'instance (anglais)
        run: echo "DEFAULT_LANGUAGE=en" >> .env

      - name: Démarrage (image de production derrière Caddy)
        run: ./scripts/preprod-local.sh up 2>&1 | tee up.log

      - name: Données de démonstration (fictives)
        run: ./scripts/preprod-local.sh demo

      - name: Contrôles
        run: |
          set -o pipefail
          ./scripts/preprod-local.sh check 2>&1 | tee check.log || {
            grep '✘' check.log | sed 's/^/::error title=Préproduction::/' || true
            exit 1; }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Captures d'écran
        run: |
          python -m pip install --quiet "playwright==1.49.1"
          python -m playwright install --with-deps chromium >/dev/null
          set -a; source .env.preprod; set +a
          echo "127.0.0.1 illwatch.localhost" | sudo tee -a /etc/hosts >/dev/null
          CAPTURE_PASSWORD="$ADMIN_PASSWORD" python scripts/captures.py https://illwatch.localhost:8443 captures

      # M11 : le scénario d'acceptation tourne à chaque modification sur le jeu de
      # démonstration (figé, reproductible), en plus de la validation hebdomadaire sur données
      # réelles. Exécuté dans le conteneur de l'API, contre l'API elle-même.
      - name: Test d'acceptation (scénario SOC, jeu figé)
        run: |
          set -o pipefail
          export COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml:docker-compose.preprod.yml
          export COMPOSE_PROFILES=full COMPOSE_PROJECT_NAME=illwatch-preprod
          set -a; source .env.preprod; set +a
          docker compose exec -T api illwatch users create --username analyst2 --role analyst \
            --email analyst2@preprod.illwatch.test --password "$ADMIN_PASSWORD" >/dev/null
          # Second processus de l'API, qui fait confiance à X-Forwarded-For venant de la boucle
          # locale (comme uvicorn en développement) : le scénario simule ainsi un attaquant et
          # la titulaire d'un compte depuis deux adresses distinctes.
          docker compose exec -d api uvicorn illwatch.app.main:app --host 127.0.0.1 --port 8001 \
            --proxy-headers --forwarded-allow-ips 127.0.0.1 --no-access-log
          for i in $(seq 1 30); do
            docker compose exec -T api python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/health')" 2>/dev/null && break
            sleep 1
          done
          docker compose exec -T -e SCENARIO_PASSWORD="$ADMIN_PASSWORD" api \
            python - http://127.0.0.1:8001 < scripts/scenario_soc.py 2>&1 | tee scenario.txt || {
            grep -E '^✘|Error|prérequis' scenario.txt | head -20 | sed 's/^/::error title=Acceptation::/' || true
            exit 1; }

      - name: Observabilité (Prometheus, Grafana) et captures des tableaux
        run: |
          set -o pipefail
          ./scripts/preprod-local.sh observability 2>&1 | tee observability.log || {
            grep '✘' observability.log | sed 's/^/::error title=Observabilité::/' || true
            exit 1; }
          set -a; source .env.preprod; set +a
          sleep 40  # quelques collectes pour remplir les courbes
          python scripts/captures_grafana.py http://127.0.0.1:3000 captures

      - name: Journaux en cas d'échec
        if: failure()
        run: |
          export COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml:docker-compose.preprod.yml
          export COMPOSE_PROFILES=full COMPOSE_PROJECT_NAME=illwatch-preprod
          set -a; source .env.preprod 2>/dev/null || true; set +a
          docker compose ps -a || true
          for svc in migrate api worker caddy; do
            docker compose logs --no-color --tail 400 "$svc" 2>/dev/null \
              | grep -Ei 'error|exception|traceback|refus|denied|fatal' | tail -n 8 \
              | sed "s/^/::error title=$svc::/" || true
          done

      - name: Captures en artefact (pour la publication)
        if: always() && hashFiles('captures/*.png') != ''
        uses: actions/upload-artifact@v7
        with:
          name: captures
          path: captures/
          retention-days: 7

  # Seul ce job écrit dans le dépôt : il ne reçoit que les images, n'exécute aucun code du
  # dépôt et n'a pas fait de checkout (aucun jeton laissé dans un .git/config).
  publish:
    name: Publication des captures (branche « captures »)
    needs: preprod
    if: always() && needs.preprod.result != 'cancelled' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        id: download
        continue-on-error: true
        with:
          name: captures
          path: captures
      - name: Pousser les captures
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          cd captures
          git init -q -b captures
          git config user.name "illwatch-ci"
          git config user.email "ci@illwatch.invalid"
          printf '# Captures — %s @ %s\n\nGénérées par le workflow Préproduction (%s).\n' \
            "$SOURCE_REF" "$GITHUB_SHA" "$GITHUB_RUN_ID" > README.md
          git add -A
          git commit -qm "Captures ${SOURCE_REF} @ ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" captures
