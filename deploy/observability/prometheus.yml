# Prometheus — ILLWATCH (M11, ADR-026)
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: illwatch-api
    metrics_path: /metrics
    # Si METRICS_TOKEN est défini côté API, décommenter :
    # authorization:
    #   credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["api:8000"]
        labels:
          instance: illwatch
