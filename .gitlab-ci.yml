# ============================================================================
# ILLWATCH — Pipeline d'intégration continue GitLab
# Cinq étapes : qualité, tests, build, sécurité, publication (GitLab Pages).
# Une merge request ne peut être fusionnée que si tout est vert (RSK-05).
# ============================================================================

stages:
  - qualite
  - tests
  - build
  - securite
  - publication

variables:
  PYTHON_IMAGE: "python:3.12-slim"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GIT_DEPTH: "20"

default:
  interruptible: true

# Le pipeline tourne sur chaque push de branche, sur les merge requests et sur
# les tags, sans jamais se dédoubler (pattern officiel GitLab « branch pipelines
# puis MR pipelines ») : une branche de fonctionnalité est testée dès son premier
# push, avant même l'ouverture de la merge request.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.python:
  image: $PYTHON_IMAGE
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip
    # constraints.txt fige toutes les versions (M7) : la CI teste ce que l'image et le poste
    # Kali installent réellement. Régénérer : uv pip compile pyproject.toml --extra dev
    #   --universal --python-version 3.12 -o constraints.txt --no-header
    - pip install -c constraints.txt -e ".[dev]"

# ---------------------------------------------------------------------------
# Étape 1 — Qualité : lint, formatage, typage strict
# ---------------------------------------------------------------------------

lint:
  extends: .python
  stage: qualite
  script:
    # Rapport lisible par le widget Code Quality des merge requests, puis
    # vérification bloquante — l'ordre compte : le rapport doit exister même
    # quand le lint échoue.
    - ruff check --output-format=gitlab . > ruff-report.json || true
    - ruff check .
    - ruff format --check .
  artifacts:
    when: always
    reports:
      codequality: ruff-report.json
    expire_in: 1 week

typage:
  extends: .python
  stage: qualite
  script:
    - mypy illwatch

# ---------------------------------------------------------------------------
# Étape 2 — Tests : suite complète contre PostgreSQL et Redis réels
# ---------------------------------------------------------------------------

tests:
  extends: .python
  stage: tests
  # 3.12 : version minimale supportée ; 3.14 : version des postes de développement.
  parallel:
    matrix:
      - PYTHON_IMAGE: ["python:3.12-slim", "python:3.14-slim"]
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7.2-alpine
      alias: redis
  variables:
    POSTGRES_USER: illwatch
    POSTGRES_PASSWORD: illwatch
    POSTGRES_DB: illwatch_test
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: "postgresql+asyncpg://illwatch:illwatch@postgres:5432/illwatch_test"
    REDIS_URL: "redis://redis:6379/0"
    SECRET_KEY: "ci-secret-key-not-for-production"
    ENVIRONMENT: "development"
  script:
    - pytest --cov-report=term-missing --cov-report=xml --junitxml=report.xml
  # Alimente le widget de couverture des merge requests
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

# Cohérence ORM ↔ migrations ↔ PostgreSQL, sur une base vierge : montée
# complète, comparaison modèle/schéma, descente complète, remontée. C'est ce
# job qui aurait signalé l'oubli de `expires_at` dans le modèle.
migrations:
  extends: .python
  stage: tests
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: illwatch
    POSTGRES_PASSWORD: illwatch
    POSTGRES_DB: illwatch_migrations
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: "postgresql+asyncpg://illwatch:illwatch@postgres:5432/illwatch_migrations"
    SECRET_KEY: "ci-secret-key-not-for-production"
  script:
    - alembic upgrade head
    - alembic check
    - alembic downgrade base
    - alembic upgrade head

# ---------------------------------------------------------------------------
# Étape 3 — Build : l'image doit se construire et la CLI répondre
# ---------------------------------------------------------------------------

# Interface web (ADR-016), miroir du job GitHub « Interface web » : schéma OpenAPI produit
# par l'API (Python), puis types générés, audit, compilation, tests et build (Node).
openapi:
  extends: .python
  stage: tests
  script:
    - SECRET_KEY=ci-secret-key-not-for-production ENVIRONMENT=development illwatch openapi -o frontend/openapi.json
  artifacts:
    paths: [frontend/openapi.json]
    expire_in: 1 day

interface:
  stage: tests
  image: node:22-bookworm-slim
  needs: [openapi]
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm]
  script:
    - cd frontend
    - npm ci --no-audit --no-fund --cache .npm
    - npm audit --audit-level=high   # outils de développement compris (0 depuis React 19 / Vite 7)
    - npm run gen:api
    - npx tsc --noEmit --pretty false
    - npm test
    - npx vite build
    - test -f dist/index.html
    - "! grep -E '<script>[^<]' dist/index.html"

image-docker:
  stage: build
  image: docker:26-cli
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - docker build -t illwatch:$CI_COMMIT_SHORT_SHA .
    - docker run --rm --entrypoint illwatch illwatch:$CI_COMMIT_SHORT_SHA version
    - docker run --rm --entrypoint test illwatch:$CI_COMMIT_SHORT_SHA -f /app/web/index.html
    # M7 lot 3 : l'image est publiée sous son SHA dans le registre du projet pour que
    # container_scanning l'analyse. Registre désactivé : avertissement, pas d'échec du build.
    - |
      if echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"; then
        docker tag illwatch:$CI_COMMIT_SHORT_SHA "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" || echo "AVERTISSEMENT : push refusé, analyse d'image impossible"
      else
        echo "AVERTISSEMENT : registre GitLab indisponible, analyse d'image impossible"
      fi

# Les deux fichiers Compose (développement et production) doivent rester valides : une
# variable mal nommée dans l'overlay de production ne se découvrirait sinon qu'au déploiement.
compose-config:
  stage: build
  image: docker:26-cli
  variables:
    SECRET_KEY: ci-dummy
    POSTGRES_PASSWORD: ci-dummy
    POSTGRES_APP_PASSWORD: ci-dummy
    REDIS_PASSWORD: ci-dummy
  script:
    - touch .env
    - docker compose -f docker-compose.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full config -q

# Publication vers le registre de conteneurs GitLab, uniquement sur tag.
publication-image:
  stage: build
  image: docker:26-cli
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"

# ---------------------------------------------------------------------------
# Étape 4 — Sécurité : analyses natives GitLab
# Sur une plateforme de threat intelligence, ne pas scanner ses propres
# dépendances serait difficile à défendre.
# ---------------------------------------------------------------------------

include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

dependency_scanning:
  stage: securite

secret_detection:
  stage: securite

sast:
  stage: securite

# M7 lot 3 : vulnérabilités de l'image (paquets système et Python). Non bloquant tant que le
# registre n'est pas confirmé actif sur le projet ; à rendre bloquant pour les CRITICAL ensuite.
container_scanning:
  stage: securite
  needs: ["image-docker"]
  variables:
    CS_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  allow_failure: true

# ---------------------------------------------------------------------------
# Étape 5 — Publication : site de présentation et documentation sur GitLab Pages
# (ADR-027, lot S6, publication intermédiaire avant le domaine définitif).
#   <CI_PAGES_URL>/        site de présentation, cinq langues
#   <CI_PAGES_URL>/docs/   documentation MkDocs
# Le formulaire de démonstration n'y est pas servi (aucune API derrière GitLab Pages) :
# « Demander une démo » ouvre un ticket GitLab (modèle Demo) tant que le VPS n'est pas en ligne.
# ---------------------------------------------------------------------------

pages:
  stage: publication
  image: node:22-bookworm-slim
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apt-get update -qq && apt-get install -y -qq python3 python3-venv >/dev/null
    - python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q "mkdocs-material>=9.5,<10"
    - export ILLWATCH_SITE_URL="$(node -e 'process.stdout.write(new URL(process.env.CI_PAGES_URL).origin)')"
    - export ILLWATCH_SITE_BASE="$(node -e 'process.stdout.write(new URL(process.env.CI_PAGES_URL).pathname)')"
    - export ILLWATCH_SITE_DOCS_URL="${CI_PAGES_URL%/}/docs/"
    - node Website/build.mjs
    - rm -rf public && cp -r Website/dist public
    - /tmp/venv/bin/python scripts/docs_prepare.py
    # Ligne entre apostrophes : « : » suivi d'un espace ferait d'elle une clé YAML.
    - 'sed -i "s#^site_url:.*#site_url: ${CI_PAGES_URL%/}/docs/#" mkdocs.yml'
    - /tmp/venv/bin/mkdocs build --site-dir public/docs
  artifacts:
    paths:
      - public
