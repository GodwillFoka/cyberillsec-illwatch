# ============================================================================
# SENTRY — Pipeline d'intégration continue GitLab
# Quatre étapes : qualité, tests, build, sécurité.
# Une merge request ne peut être fusionnée que si tout est vert (RSK-05).
# ============================================================================

stages:
  - qualite
  - tests
  - build
  - securite

variables:
  PYTHON_IMAGE: "python:3.12-slim"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GIT_DEPTH: "20"

default:
  interruptible: true

# Le pipeline tourne sur chaque push de branche, sur les merge requests et sur
# les tags, sans jamais se dédoubler (pattern officiel GitLab « branch pipelines
# puis MR pipelines ») : une branche de fonctionnalité est testée dès son premier
# push, avant même l'ouverture de la merge request.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.python:
  image: $PYTHON_IMAGE
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip
    # constraints.txt fige toutes les versions (M7) : la CI teste ce que l'image et le poste
    # Kali installent réellement. Régénérer : uv pip compile pyproject.toml --extra dev
    #   --universal --python-version 3.12 -o constraints.txt --no-header
    - pip install -c constraints.txt -e ".[dev]"

# ---------------------------------------------------------------------------
# Étape 1 — Qualité : lint, formatage, typage strict
# ---------------------------------------------------------------------------

lint:
  extends: .python
  stage: qualite
  script:
    # Rapport lisible par le widget Code Quality des merge requests, puis
    # vérification bloquante — l'ordre compte : le rapport doit exister même
    # quand le lint échoue.
    - ruff check --output-format=gitlab . > ruff-report.json || true
    - ruff check .
    - ruff format --check .
  artifacts:
    when: always
    reports:
      codequality: ruff-report.json
    expire_in: 1 week

typage:
  extends: .python
  stage: qualite
  script:
    - mypy sentry

# ---------------------------------------------------------------------------
# Étape 2 — Tests : suite complète contre PostgreSQL et Redis réels
# ---------------------------------------------------------------------------

tests:
  extends: .python
  stage: tests
  # 3.12 : version minimale supportée ; 3.14 : version des postes de développement.
  parallel:
    matrix:
      - PYTHON_IMAGE: ["python:3.12-slim", "python:3.14-slim"]
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7.2-alpine
      alias: redis
  variables:
    POSTGRES_USER: sentry
    POSTGRES_PASSWORD: sentry
    POSTGRES_DB: sentry_test
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: "postgresql+asyncpg://sentry:sentry@postgres:5432/sentry_test"
    REDIS_URL: "redis://redis:6379/0"
    SECRET_KEY: "ci-secret-key-not-for-production"
    ENVIRONMENT: "development"
  script:
    - pytest --cov-report=term-missing --cov-report=xml --junitxml=report.xml
  # Alimente le widget de couverture des merge requests
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

# Cohérence ORM ↔ migrations ↔ PostgreSQL, sur une base vierge : montée
# complète, comparaison modèle/schéma, descente complète, remontée. C'est ce
# job qui aurait signalé l'oubli de `expires_at` dans le modèle.
migrations:
  extends: .python
  stage: tests
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: sentry
    POSTGRES_PASSWORD: sentry
    POSTGRES_DB: sentry_migrations
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: "postgresql+asyncpg://sentry:sentry@postgres:5432/sentry_migrations"
    SECRET_KEY: "ci-secret-key-not-for-production"
  script:
    - alembic upgrade head
    - alembic check
    - alembic downgrade base
    - alembic upgrade head

# ---------------------------------------------------------------------------
# Étape 3 — Build : l'image doit se construire et la CLI répondre
# ---------------------------------------------------------------------------

image-docker:
  stage: build
  image: docker:26-cli
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - docker build -t sentry:$CI_COMMIT_SHORT_SHA .
    - docker run --rm --entrypoint sentry sentry:$CI_COMMIT_SHORT_SHA version

# Publication vers le registre de conteneurs GitLab, uniquement sur tag.
publication-image:
  stage: build
  image: docker:26-cli
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"

# ---------------------------------------------------------------------------
# Étape 4 — Sécurité : analyses natives GitLab
# Sur une plateforme de threat intelligence, ne pas scanner ses propres
# dépendances serait difficile à défendre.
# ---------------------------------------------------------------------------

include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml

dependency_scanning:
  stage: securite

secret_detection:
  stage: securite

sast:
  stage: securite
