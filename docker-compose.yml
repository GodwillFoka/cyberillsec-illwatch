# Infrastructure de développement local — T1.4 du planning
services:
  postgres:
    image: postgres:16-alpine
    container_name: sentry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentry
      POSTGRES_PASSWORD: sentry
      POSTGRES_DB: sentry
    # Écoute locale uniquement (M7) : sur un poste Kali relié à un réseau, la base ne doit pas
    # être joignable depuis le LAN avec le mot de passe de développement.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sentry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentry -d sentry"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: sentry-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Redis sans mot de passe en développement : écoute locale uniquement (M7).
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - sentry_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: sentry-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sentry:sentry@postgres:5432/sentry
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

  # Planificateur de collecte (T2.6). Plusieurs répliques possibles : verrou Redis par flux.
  worker:
    build: .
    container_name: sentry-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sentry:sentry@postgres:5432/sentry
      REDIS_URL: redis://redis:6379/0
    entrypoint: ["sentry", "feeds", "worker"]
    healthcheck:
      disable: true  # le HEALTHCHECK de l'image vise l'API HTTP, absente ici
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

volumes:
  sentry_pgdata:
  sentry_redisdata:
