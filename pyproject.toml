[project]
name = "sentry-cti"
version = "0.1.0"
description = "SENTRY — Security Monitoring & Cyber Threat Intelligence Platform (CyberillSec, a CYBERILL initiative)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Godwill FOKA", email = "contact@cyberill.com" }]
keywords = ["cti", "threat-intelligence", "cve", "epss", "kev", "soc", "security"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-redis",
]

[project.scripts]
sentry = "sentry.cli.main:cli"

[project.urls]
Homepage = "https://github.com/GodwillFoka/CYBERILLSEC-SENTRY"
Repository = "https://github.com/GodwillFoka/CYBERILLSEC-SENTRY"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentry*"]

# ----------------------------------------------------------------------------
# Qualité de code — §6.3 du Cahier des Charges
# ----------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ASYNC", "S"]
ignore = ["S101"]  # assert autorisé dans les tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B008"]
"alembic/*" = ["E", "F", "I", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=sentry --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
