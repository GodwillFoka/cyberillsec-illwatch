[project]
name = "illwatch"
version = "0.2.0.dev0"
description = "ILLWATCH — Security Monitoring & Cyber Threat Intelligence Platform (CyberillSec, a CYBERILL initiative)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Godwill FOKA", email = "fokagodwill@gmail.com" }]
keywords = ["cti", "threat-intelligence", "cve", "epss", "kev", "soc", "security"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.16.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.9.0",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.9",
    "taxii2-client==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-redis",
    "types-requests",
]

[project.scripts]
illwatch = "illwatch.cli.main:cli"

[project.urls]
Homepage = "https://gitlab.com/GodwillFoka/cyberillsec-illwatch"
Repository = "https://gitlab.com/GodwillFoka/cyberillsec-illwatch"
Mirror = "https://github.com/GodwillFoka/cyberillsec-illwatch"
Documentation = "https://godwillfoka.github.io/cyberillsec-illwatch/"
Changelog = "https://github.com/GodwillFoka/cyberillsec-illwatch/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["illwatch*"]

# ----------------------------------------------------------------------------
# Qualité de code — §6.3 du Cahier des Charges
# ----------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ASYNC", "S"]
ignore = ["S101"]  # assert autorisé dans les tests

[tool.ruff.lint.isort]
# Le dossier local `alembic/` (scripts de migration) ne doit pas masquer le paquet tiers.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B008"]
"alembic/*" = ["E", "F", "I", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
# taxii2-client ne publie pas d'annotations de types.
module = ["taxii2client", "taxii2client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=illwatch --cov-report=term-missing"

[tool.coverage.run]
# SQLAlchemy async exécute le code dans des greenlets : sans cette option, les
# lignes qui suivent un `await` en base sont comptées à tort comme non couvertes.
concurrency = ["greenlet", "thread"]
source = ["illwatch"]

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
